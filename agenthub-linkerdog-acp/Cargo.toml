[package]
name = "agenthub-linkerdog-acp"
version = "0.1.0"
edition = "2024"
authors = ["AgentHub <dev@agenthub.local>"]
license = "Apache-2.0"
description = "Standalone Linkerdog ACP adapter package for AgentHub"
repository = "https://github.com/hawkingrei/agenthub"
homepage = "https://github.com/hawkingrei/agenthub"

[[bin]]
name = "linkerdog"
path = "src/main.rs"

[lib]
name = "agenthub_linkerdog_acp"
path = "src/lib.rs"

[dependencies]
agent-client-protocol = { version = "=0.9.4", features = ["unstable"] }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
let-underscore = "warn"
rust-2018-idioms = "warn"
unused = "warn"
