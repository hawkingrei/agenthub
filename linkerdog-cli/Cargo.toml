[package]
name = "linkerdog-cli"
version = "0.1.0"
edition = "2024"
authors = ["AgentHub <dev@agenthub.local>"]
license = "Apache-2.0"
description = "Linkerdog CLI binary entrypoint"
repository = "https://github.com/hawkingrei/agenthub"
homepage = "https://github.com/hawkingrei/agenthub"

[[bin]]
name = "linkerdog"
path = "src/main.rs"

[lib]
name = "linkerdog_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
linkerdog-acp = { path = "../linkerdog-acp" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints.rust]
let-underscore = "warn"
rust-2018-idioms = "warn"
unused = "warn"
