[package]
name = "agenthub-daemon"
version = "0.0.10"
edition = "2024"
license = "Apache-2.0"
description = "AgentHub long-running daemon and internal provider runtime"
repository = "https://github.com/hawkingrei/agenthub"
homepage = "https://github.com/hawkingrei/agenthub"

[[bin]]
name = "agenthubd"
path = "src/main.rs"

[lib]
name = "agenthub_daemon"
path = "src/lib.rs"

[features]
default = []
release-vendored-openssl = [
    "agenthub/release-vendored-openssl",
    "agenthub-acp-adapter/release-vendored-openssl",
]
release-lance-fp16 = ["agenthub/release-lance-fp16"]
rocksdb = ["agenthub/rocksdb"]
object-store-s3 = ["agenthub/object-store-s3"]

[dependencies]
agenthub = { path = "../.." }
agenthub-acp-adapter = { path = "../agenthub-acp-adapter" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
codex-arg0 = { git = "https://github.com/openai/codex", rev = "90854393966b21e9ebfd21b122334eb09a20c93d" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints.rust]
let-underscore = "warn"
rust-2018-idioms = "warn"
unused = "warn"
