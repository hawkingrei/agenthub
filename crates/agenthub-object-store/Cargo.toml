[package]
name = "agenthub-object-store"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
s3 = [
    "dep:aws-credential-types",
    "dep:aws-sigv4",
    "dep:aws-smithy-runtime-api",
    "dep:http",
    "dep:percent-encoding",
    "dep:quick-xml",
    "dep:reqwest",
    "dep:serde",
    "opendal/http-transport-reqwest",
    "opendal/services-s3",
]

[dependencies]
anyhow = "1"
aws-credential-types = { version = "=1.2.14", optional = true }
aws-sigv4 = { version = "=1.4.3", optional = true }
aws-smithy-runtime-api = { version = "=1.12.0", features = ["client"], optional = true }
http = { version = "1", optional = true }
opendal = { version = "0.58", default-features = false, features = ["services-fs"] }
percent-encoding = { version = "2", optional = true }
quick-xml = { version = "0.41", features = ["serialize"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
