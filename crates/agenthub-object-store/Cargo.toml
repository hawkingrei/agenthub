[package]
name = "agenthub-object-store"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
s3 = ["opendal/http-transport-reqwest", "opendal/services-s3"]

[dependencies]
anyhow = "1"
bytes = "1"
futures-util = "0.3"
log = "0.4"
opendal = { version = "0.58", default-features = false, features = ["services-fs"] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
