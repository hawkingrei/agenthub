[package]
name = "agenthub-diagnostics"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
agenthub-agent-domain = { path = "../agenthub-agent-domain" }
agenthub-agent-event-codec = { path = "../agenthub-agent-event-codec" }
agenthub-db = { path = "../agenthub-db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
