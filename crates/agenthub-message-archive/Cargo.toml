[package]
name = "agenthub-message-archive"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
arrow-array = "57.3.0"
arrow-schema = "57.3.0"
async-trait = "0.1"
futures = "0.3"
lance = { version = "=4.0.0", default-features = false, features = ["protoc"] }
lance-index = { version = "=4.0.0", features = ["protoc"] }
lancedb = "0.27.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
