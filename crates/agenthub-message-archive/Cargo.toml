[package]
name = "agenthub-message-archive"
version = "0.0.10"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
release-lance-fp16 = ["lancedb/fp16kernels"]

[dependencies]
anyhow = "1"
arrow-array = "59.2.0"
arrow-schema = "59.1.0"
async-trait = "0.1"
futures = "0.3"
lance-index = "=8.0.0"
lancedb = "0.31.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
