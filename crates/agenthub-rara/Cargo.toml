[package]
name = "agenthub-rara"
version = "0.0.10"
edition = "2024"
license = "Apache-2.0"

[dependencies]
agenthub-config = { path = "../agenthub-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "process"] }
