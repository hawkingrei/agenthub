[package]
name = "agenthub-mcp"
version = "0.0.10"
edition = "2024"
license = "Apache-2.0"

[dependencies]
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
axum = "0.8"
futures = "0.3"
