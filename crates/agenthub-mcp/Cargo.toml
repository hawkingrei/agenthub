[package]
name = "agenthub-mcp"
version = "0.0.10"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
agenthub-agent-domain = { path = "../agenthub-agent-domain" }
agenthub-db = { path = "../agenthub-db" }
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
axum = "0.8"
futures = "0.3"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
