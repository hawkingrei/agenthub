[package]
name = "agenthub-acp-adapter"
version = "0.0.10"
edition = "2024"
authors = ["AgentHub <dev@agenthub.local>"]
license = "Apache-2.0"
description = "AgentHub ACP provider adapter entrypoint"
repository = "https://github.com/hawkingrei/agenthub"
homepage = "https://github.com/hawkingrei/agenthub"

[lib]
name = "agenthub_acp_adapter"
path = "src/lib.rs"

[dependencies]
agenthub-codex-acp-runtime = { path = "../../agenthub-codex-acp" }
anyhow = "1"
claude-code-acp-rs = { version = "0.1.22", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
codex-utils-cli = { git = "https://github.com/openai/codex", rev = "90854393966b21e9ebfd21b122334eb09a20c93d" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[features]
default = []
release-vendored-openssl = ["agenthub-codex-acp-runtime/release-vendored-openssl"]

[lints.rust]
let-underscore = "warn"
rust-2018-idioms = "warn"
unused = "warn"
