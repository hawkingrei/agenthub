[package]
name = "agenthub-push"
version = "0.0.10"
edition = "2024"
license = "Apache-2.0"

[dependencies]
agenthub-config = { path = "../agenthub-config" }
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", features = ["clock"] }
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust", "jwe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
web-push = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
