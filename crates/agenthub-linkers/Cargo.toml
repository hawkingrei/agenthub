[package]
name = "agenthub-linkers"
version = "0.0.10"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
agenthub-db = { path = "../agenthub-db" }
base64 = "0.23"
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
