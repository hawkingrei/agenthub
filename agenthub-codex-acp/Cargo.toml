[package]
name = "agenthub-codex-acp"
version = "0.10.0"
edition = "2024"
authors = ["AgentHub <dev@agenthub.local>"]
license = "Apache-2.0"
description = "AgentHub ACP adapter for validating ACP pipelines"
repository = "https://github.com/hawkingrei/agenthub"
homepage = "https://github.com/hawkingrei/agenthub"

[[bin]]
name = "agenthub-codex-acp"
path = "src/main.rs"

[lib]
name = "agenthub_codex_acp"
path = "src/lib.rs"

[dependencies]
agent-client-protocol = { version = "=0.10.3", features = ["unstable"] }
agenthub-managed-skills = { path = "../crates/agenthub-managed-skills" }
anyhow = "1"
async-trait = "0.1"
clap = "4"
codex-apply-patch = { git = "https://github.com/zed-industries/codex", rev = "ab7a5b87a9e455235f65637f1675c03051481c87" }
codex-arg0 = { git = "https://github.com/zed-industries/codex", rev = "ab7a5b87a9e455235f65637f1675c03051481c87" }
codex-core = { git = "https://github.com/zed-industries/codex", rev = "ab7a5b87a9e455235f65637f1675c03051481c87" }
codex-mcp-server = { git = "https://github.com/zed-industries/codex", rev = "ab7a5b87a9e455235f65637f1675c03051481c87" }
codex-protocol = { git = "https://github.com/zed-industries/codex", rev = "ab7a5b87a9e455235f65637f1675c03051481c87" }
codex-login = { git = "https://github.com/zed-industries/codex", rev = "ab7a5b87a9e455235f65637f1675c03051481c87" }
codex-shell-command = { git = "https://github.com/zed-industries/codex", rev = "ab7a5b87a9e455235f65637f1675c03051481c87" }
codex-utils-approval-presets = { git = "https://github.com/zed-industries/codex", rev = "ab7a5b87a9e455235f65637f1675c03051481c87" }
codex-utils-cli = { git = "https://github.com/zed-industries/codex", rev = "ab7a5b87a9e455235f65637f1675c03051481c87" }
heck = "0.5.0"
itertools = "0.14.0"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
# Keep json key ordering aligned with codex CLI behavior.
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.13.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
piper = "0.2"
tempfile = "3"

[lints.rust]
let-underscore = "warn"
rust-2018-idioms = "warn"
unused = "warn"
