[workspace]
members = [
    ".",
    "agenthub-codex-acp",
    "crates/agenthub-daemon",
    "crates/agenthub-acp-adapter",
    "crates/agenthub-acp-core",
    "crates/agenthub-acp",
    "crates/agenthub-managed-skills",
    "crates/agenthub-internal-p2p",
    "crates/agenthub-text",
    "crates/agenthub-team-actor",
    "crates/agenthub-team-domain",
    "crates/agenthub-team-prompts",
    "crates/agenthub-agent-domain",
    "crates/agenthub-agent-event-codec",
    "crates/agenthub-auth-domain",
    "crates/agenthub-auth-passkeys",
    "crates/agenthub-auth-store",
    "crates/agenthub-diagnostics",
    "crates/agenthub-doctor-cli",
    "crates/agenthub-internal-tls",
    "crates/agenthub-linkers",
    "crates/agenthub-push",
    "crates/agenthub-logging",
    "crates/agenthub-config",
    "crates/agenthub-db",
    "crates/agenthub-pyroscope",
    "crates/agenthub-message-archive",
    "crates/agenthub-message-store",
    "crates/agenthub-object-store",
]
[patch.crates-io]
sacp = { git = "https://github.com/hawkingrei/symposium-acp", rev = "c731bb045d1375af48b0446af728aea52503b30b" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

[package]
name = "agenthub"
version = "0.0.10"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
release-vendored-openssl = ["dep:openssl"]
release-lance-fp16 = ["agenthub-message-archive/release-lance-fp16"]
# Compile the native RocksDB-backed message body store into the binary. Off by
# default and enabled per release target (x86_64) so the native librocksdb-sys
# build does not affect default/Bazel/aarch64 builds.
rocksdb = ["agenthub-message-store/rocksdb"]
object-store-s3 = ["agenthub-object-store/s3"]

[[bin]]
name = "agenthub"
path = "cmd/agenthub/src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time", "io-util", "io-std"] }
tokio-util = { version = "0.7", features = ["compat"] }
toon-format = { version = "0.5.0", default-features = false }
tower-http = { version = "0.7", features = ["fs", "trace", "cors", "compression-gzip"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Pin problematic transitive dependencies
icu_calendar = "=2.3.0"
icu_decimal = "=2.3.0"
superboring = "=0.1.14"

uuid = { version = "1", features = ["v4", "v7", "serde"] }
web-push = "0.11"
webauthn-rs = "0.5"
url = "2"
argon2 = "0.5"
rand = "0.10"
base64 = "0.23"
bytes = "1"
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust", "jwe"] }
jsonwebtoken = "=11.0.0"
mime_guess = "2"
rust-embed = "8"
async-trait = "0.1"
hmac = "0.13.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.11"
zstd = "0.13"
# Force vendored OpenSSL only for release-style Cargo builds so transitive Linux
# release dependencies like webauthn-rs and web-push/isahc do not bind to the
# stale OpenSSL 1.0.2 sysroot that ships in the default cross images.
openssl = { version = "0.10", features = ["vendored"], optional = true }
agenthub-acp = { path = "crates/agenthub-acp" }
agenthub-managed-skills = { path = "crates/agenthub-managed-skills" }
agenthub-internal-p2p = { path = "crates/agenthub-internal-p2p" }
agenthub-text = { path = "crates/agenthub-text" }
agenthub-team-actor = { path = "crates/agenthub-team-actor" }
agenthub-team-domain = { path = "crates/agenthub-team-domain" }
agenthub-team-prompts = { path = "crates/agenthub-team-prompts" }
agenthub-agent-domain = { path = "crates/agenthub-agent-domain" }
agenthub-agent-event-codec = { path = "crates/agenthub-agent-event-codec" }
agenthub-auth-domain = { path = "crates/agenthub-auth-domain" }
agenthub-auth-passkeys = { path = "crates/agenthub-auth-passkeys" }
agenthub-auth-store = { path = "crates/agenthub-auth-store" }
agenthub-diagnostics = { path = "crates/agenthub-diagnostics" }
agenthub-doctor-cli = { path = "crates/agenthub-doctor-cli" }
agenthub-internal-tls = { path = "crates/agenthub-internal-tls" }
agenthub-linkers = { path = "crates/agenthub-linkers" }
agenthub-push = { path = "crates/agenthub-push" }
agenthub-logging = { path = "crates/agenthub-logging" }
agenthub-message-archive = { path = "crates/agenthub-message-archive" }
agenthub-config = { path = "crates/agenthub-config" }
agenthub-db = { path = "crates/agenthub-db" }
agenthub-message-store = { path = "crates/agenthub-message-store" }
agenthub-object-store = { path = "crates/agenthub-object-store" }
agenthub-pyroscope = { path = "crates/agenthub-pyroscope" }
agent-client-protocol = { version = "2.0.0", features = ["unstable"] }
prost = "=0.14.3"
tonic-prost = "=0.14.3"
tonic = { version = "=0.14.3", features = ["transport", "tls-native-roots"] }
rcgen = "0.14"
rustls = "0.23.40"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tonic-prost-build = "=0.14.3"
protoc-bin-vendored = "3"

[profile.release]
strip = true
opt-level = 3
lto = "thin"
