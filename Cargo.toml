[workspace]
members = [".", "agenthub-codex-acp"]

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/JakkuSakura/tokio-tungstenite", branch = "proxy-support" }
tungstenite = { git = "https://github.com/JakkuSakura/tungstenite-rs.git", branch = "proxy-support" }

[patch."ssh://git@github.com/JakkuSakura/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/JakkuSakura/tungstenite-rs.git", branch = "proxy-support" }

[package]
name = "agenthub"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "compression-gzip"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
web-push = "0.10"
webauthn-rs = "0.4"
url = "2"
argon2 = "0.5"
rand = "0.8"
base64 = "0.13"
jwt-simple = "0.11"
mime_guess = "2"
rust-embed = "8"
async-trait = "0.1"
agent-client-protocol = { version = "0.9.4", features = ["unstable"] }
