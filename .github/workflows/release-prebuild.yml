name: Release Prebuild

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: 0.2.5

jobs:
  prebuild:
    name: Prebuild ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            arch: amd64
            cross: true
            agenthub_features: release-vendored-openssl,release-lance-fp16
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            arch: arm64
            cross: true
            agenthub_features: release-vendored-openssl
          - target: aarch64-apple-darwin
            os: macos-14
            arch: arm64
            cross: false
            agenthub_features: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          profile: minimal
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux cross-compilation)
        if: matrix.cross
        run: |
          cargo install cross --version ${{ env.CROSS_VERSION }} --locked

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libcap-dev protobuf-compiler

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install protobuf

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-prebuild-${{ matrix.target }}

      - name: Build agenthub (native)
        if: '!matrix.cross'
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --bin agenthub ${{ matrix.agenthub_features && format('--features {0}', matrix.agenthub_features) || '' }}

      - name: Build agenthub (cross)
        if: matrix.cross
        run: |
          cross build --locked --release --target ${{ matrix.target }} --bin agenthub --features ${{ matrix.agenthub_features }}

      - name: Build agenthub-codex-acp (native)
        if: '!matrix.cross'
        run: |
          cargo build --locked --release --target ${{ matrix.target }} -p agenthub-codex-acp

      - name: Build agenthub-codex-acp (cross)
        if: matrix.cross
        run: |
          cross build --locked --release --target ${{ matrix.target }} -p agenthub-codex-acp --features release-vendored-openssl

      - name: Package
        shell: bash
        run: |
          REF_NAME="${{ github.head_ref || github.ref_name }}"
          SAFE_REF="$(echo "${REF_NAME}" | tr '/:@ ' '-' | tr -cd '[:alnum:]._-')"
          TARGET="${{ matrix.target }}"
          ARCH="${{ matrix.arch }}"

          if [[ "${{ matrix.os }}" == ubuntu* ]]; then
            OS_NAME="linux"
          elif [[ "${{ matrix.os }}" == macos* ]]; then
            OS_NAME="darwin"
          else
            OS_NAME="unknown"
          fi

          mkdir -p dist

          package_binary() {
            local binary_name="$1"
            local package_name="${binary_name}-${SAFE_REF}-${OS_NAME}-${ARCH}"
            local package_dir="dist/${package_name}"
            mkdir -p "${package_dir}"
            cp "target/${TARGET}/release/${binary_name}" "${package_dir}/"
            cp README.md "${package_dir}/"
            if [[ -f LICENSE ]]; then
              cp LICENSE "${package_dir}/"
            fi
            tar -C dist -czf "dist/${package_name}.tar.gz" "${package_name}"
            rm -rf "${package_dir}"
          }

          package_binary "agenthub"
          package_binary "agenthub-codex-acp"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-prebuild-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 7
