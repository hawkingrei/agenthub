name: Distributed P2P Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  distributed-p2p:
    name: Distributed P2P Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libcap-dev protobuf-compiler
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.120.0
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Verify internal protobuf codegen
        run: make proto-check
      - name: Build daemon
        run: cargo build --locked -p agenthub-daemon --bin agenthubd
      - name: Run distributed p2p blackbox integration
        run: cargo test --locked --test distributed_p2p_pipeline -- --nocapture
      - name: Upload p2p node logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: distributed-p2p-node-logs
          path: target/p2p-pipeline-logs
          if-no-files-found: ignore
