name: Rust

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  rust-fmt:
    name: Rust (Fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          profile: minimal
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Cargo fmt (workspace)
        run: cargo fmt --all --check

  rust-cargo:
    name: Rust (Cargo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libcap-dev protobuf-compiler
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          profile: minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Cargo check (workspace)
        run: cargo check --workspace --locked

  rust-object-store-s3-minio:
    name: Rust (Object Store S3 MinIO)
    runs-on: ubuntu-latest
    env:
      MINIO_ROOT_USER: agenthubminio
      MINIO_ROOT_PASSWORD: agenthubminio123
      AGENTHUB_OBJECT_STORE_S3_TEST_ENDPOINT: http://127.0.0.1:9000
      AGENTHUB_OBJECT_STORE_S3_TEST_BUCKET: agenthub-object-store-test
      AGENTHUB_OBJECT_STORE_S3_TEST_REGION: us-east-1
      AGENTHUB_OBJECT_STORE_S3_TEST_ACCESS_KEY_ID: agenthubminio
      AGENTHUB_OBJECT_STORE_S3_TEST_SECRET_ACCESS_KEY: agenthubminio123
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y curl protobuf-compiler
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          profile: minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Start MinIO
        run: |
          docker run -d --name agenthub-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="${MINIO_ROOT_USER}" \
            -e MINIO_ROOT_PASSWORD="${MINIO_ROOT_PASSWORD}" \
            minio/minio:RELEASE.2025-06-13T11-33-47Z \
            server /data --address ":9000"
          for i in {1..30}; do
            if curl -fsS "${AGENTHUB_OBJECT_STORE_S3_TEST_ENDPOINT}/minio/health/ready"; then
              exit 0
            fi
            sleep 1
          done
          docker logs agenthub-minio
          exit 1
      - name: Create fixture bucket
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          chmod +x /tmp/mc
          /tmp/mc alias set local "${AGENTHUB_OBJECT_STORE_S3_TEST_ENDPOINT}" "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
          /tmp/mc mb --ignore-existing "local/${AGENTHUB_OBJECT_STORE_S3_TEST_BUCKET}"
      - name: Cargo test object store S3 fixture
        run: cargo test -p agenthub-object-store --features s3 --locked s3_compatible_store_exercises_bytes_and_hosted_images -- --nocapture
      - name: Cargo test API S3 multipart route fixture
        run: cargo test --features object-store-s3 --locked team_upload_session_s3_multipart_route_fixture_publishes_metadata -- --nocapture

  rust-message-store-rocksdb:
    name: Rust (Message Store RocksDB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install system deps
        # clang provides the bindgen resource headers (stdbool.h) and libzstd-dev
        # provides zstd.h, both needed to build the native librocksdb-sys backend.
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libcap-dev protobuf-compiler clang libzstd-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          profile: minimal
          components: clippy, rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Cargo fmt (rocksdb feature)
        run: cargo fmt -p agenthub-message-store -- --check
      - name: Cargo clippy (rocksdb feature)
        run: cargo clippy -p agenthub-message-store --features rocksdb --all-targets --locked
      - name: Cargo test (rocksdb feature)
        run: cargo test -p agenthub-message-store --features rocksdb --locked

  rust-proto-check:
    name: Rust (Proto Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libcap-dev protobuf-compiler
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          profile: minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Verify internal protobuf codegen
        run: make proto-check

  rust-grpc-integration:
    name: Rust (gRPC Integration)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libcap-dev protobuf-compiler
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          profile: minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Distributed agent node gRPC integration tests
        run: |
          cargo test --locked remote_actor_grpc_pipeline_delivers_and_acks_over_tls -- --nocapture
          cargo test --locked bidirectional_actor_grpc_pipeline_relays_seeded_messages_between_in_process_states -- --nocapture
          cargo test --locked remote_agent_grpc_control_starts_inputs_and_lists_events_over_tls -- --nocapture

  rust-coverage:
    name: Rust (Coverage)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libcap-dev protobuf-compiler
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          profile: minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Setup Rust coverage tool
        run: |
          rustup component add llvm-tools-preview
          if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo install cargo-llvm-cov --locked
          fi
          cargo llvm-cov --version
      - name: Cargo test coverage (workspace)
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path rust-cargo.lcov
          wc -l rust-cargo.lcov
      - name: Upload coverage reports to Codecov
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rust-cargo.lcov
          flags: rust-cargo
          name: rust-cargo-coverage
          fail_ci_if_error: true
