name: Rust

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  rust-fmt:
    name: Rust (Fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          profile: minimal
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Cargo fmt (workspace)
        run: cargo fmt --all --check

  rust-cargo:
    name: Rust (Cargo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libcap-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          profile: minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Cargo check (workspace)
        run: cargo check --workspace --locked

  rust-proto-check:
    name: Rust (Proto Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libcap-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          profile: minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Verify internal protobuf codegen
        run: make proto-check

  rust-grpc-integration:
    name: Rust (gRPC Integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libcap-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          profile: minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Distributed agent node gRPC integration tests
        run: |
          cargo test --locked remote_actor_grpc_pipeline_delivers_and_acks_over_tls -- --nocapture
          cargo test --locked bidirectional_actor_grpc_pipeline_relays_seeded_messages_between_in_process_states -- --nocapture
          cargo test --locked remote_agent_grpc_control_starts_inputs_and_lists_events_over_tls -- --nocapture

  rust-coverage:
    name: Rust (Coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libcap-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          profile: minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Setup Rust coverage tool
        run: |
          rustup component add llvm-tools-preview
          if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo install cargo-llvm-cov --locked
          fi
          cargo llvm-cov --version
      - name: Cargo test coverage (workspace)
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path rust-cargo.lcov
          wc -l rust-cargo.lcov
      - name: Upload coverage reports to Codecov
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rust-cargo.lcov
          flags: rust-cargo
          name: rust-cargo-coverage
          fail_ci_if_error: true
