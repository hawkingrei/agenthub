name: Rust

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  rust:
    name: Rust (Cargo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libcap-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          profile: minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Verify internal protobuf codegen
        run: make proto-check
      - name: Setup Rust coverage tool
        run: |
          rustup component add llvm-tools-preview
          if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo install cargo-llvm-cov --locked
          fi
          cargo llvm-cov --version
      - name: Cargo check (workspace)
        run: cargo check --workspace --locked
      - name: Cargo test coverage (workspace)
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path rust-cargo.lcov
          wc -l rust-cargo.lcov
      - name: Upload coverage reports to Codecov
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rust-cargo.lcov
          flags: rust-cargo
          name: rust-cargo-coverage
          fail_ci_if_error: true
