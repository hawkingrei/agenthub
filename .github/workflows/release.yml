name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (for example v0.1.0 or preview-2026-03-26)'
        required: true
      confirm_create_release_tag:
        description: 'Required when workflow_dispatch creates a new semver-looking tag'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: 0.2.5

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            arch: amd64
            cross: true
          
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            arch: arm64
            cross: true
          
          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-14
            arch: arm64
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          profile: minimal
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux cross-compilation)
        if: matrix.cross
        run: |
          cargo install cross --version ${{ env.CROSS_VERSION }} --locked

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libcap-dev protobuf-compiler

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install protobuf

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build agenthub (native)
        if: '!matrix.cross'
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --bin agenthub

      - name: Build agenthub (cross)
        if: matrix.cross
        run: |
          cross build --locked --release --target ${{ matrix.target }} --bin agenthub --features release-vendored-openssl

      - name: Build agenthub-codex-acp (native)
        if: '!matrix.cross'
        run: |
          cargo build --locked --release --target ${{ matrix.target }} -p agenthub-codex-acp

      - name: Build agenthub-codex-acp (cross)
        if: matrix.cross
        run: |
          cross build --locked --release --target ${{ matrix.target }} -p agenthub-codex-acp --features release-vendored-openssl

      - name: Package
        shell: bash
        run: |
          TAG_VERSION="${{ github.event.inputs.version || github.ref_name }}"
          ASSET_VERSION="${TAG_VERSION#v}"
          TARGET="${{ matrix.target }}"
          ARCH="${{ matrix.arch }}"

          if [[ "${{ matrix.os }}" == ubuntu* ]]; then
            OS_NAME="linux"
          elif [[ "${{ matrix.os }}" == macos* ]]; then
            OS_NAME="darwin"
          else
            OS_NAME="unknown"
          fi

          mkdir -p dist

          package_binary() {
            local binary_name="$1"
            local package_name="${binary_name}-${ASSET_VERSION}-${OS_NAME}-${ARCH}"
            local package_dir="dist/${package_name}"
            mkdir -p "${package_dir}"
            cp "target/${TARGET}/release/${binary_name}" "${package_dir}/"
            cp README.md "${package_dir}/"
            if [[ -f LICENSE ]]; then
              cp LICENSE "${package_dir}/"
            fi
            tar -C dist -czf "dist/${package_name}.tar.gz" "${package_name}"
            rm -rf "${package_dir}"
          }

          package_binary "agenthub"
          package_binary "agenthub-codex-acp"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 1

  publish_npm:
    name: Publish npm packages
    needs: build
    if: ${{ needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Prepare npm metadata
        id: npm_meta
        shell: bash
        run: |
          TAG_VERSION="${{ github.event.inputs.version || github.ref_name }}"
          PACKAGE_VERSION="${TAG_VERSION#v}"
          PUBLISH_NPM=false
          if [[ "${PACKAGE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            PUBLISH_NPM=true
          fi
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish_npm=${PUBLISH_NPM}" >> "$GITHUB_OUTPUT"

      - name: Skip npm publish for non-semver tags
        if: steps.npm_meta.outputs.publish_npm != 'true'
        run: |
          echo "Skipping npm publish for tag ${GITHUB_REF_NAME:-${{ steps.npm_meta.outputs.tag_version }}} because it is not a semver package version."

      - name: Verify NPM_TOKEN is configured
        if: steps.npm_meta.outputs.publish_npm == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo "::error::NPM_TOKEN is required to publish @linkerdao/agenthub packages."
            exit 1
          fi

      - name: Prepare staged npm packages
        if: steps.npm_meta.outputs.publish_npm == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.npm_meta.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail

          ROOT_DIR="${PWD}"
          STAGE_ROOT="${ROOT_DIR}/dist/npm"
          mkdir -p "${STAGE_ROOT}"

          stage_platform_package() {
            local source_dir="$1"
            local stage_dir="$2"
            local archive_name="$3"

            rm -rf "${stage_dir}"
            mkdir -p "${stage_dir}"
            cp -R "${source_dir}/." "${stage_dir}/"
            rm -f "${stage_dir}/bin/.gitkeep"

            local unpack_dir="${stage_dir}/.unpack"
            mkdir -p "${unpack_dir}"
            tar -xzf "${ROOT_DIR}/dist/${archive_name}" -C "${unpack_dir}"
            local binary_path
            binary_path="$(find "${unpack_dir}" -type f -name agenthub | head -n 1)"
            if [[ -z "${binary_path}" ]]; then
              echo "::error::Unable to locate agenthub binary in ${archive_name}"
              exit 1
            fi
            mkdir -p "${stage_dir}/bin"
            cp "${binary_path}" "${stage_dir}/bin/agenthub"
            chmod +x "${stage_dir}/bin/agenthub"
            rm -rf "${unpack_dir}"
          }

          stage_platform_package \
            "${ROOT_DIR}/build/npm/agenthub-darwin-arm64" \
            "${STAGE_ROOT}/agenthub-darwin-arm64" \
            "agenthub-${PACKAGE_VERSION}-darwin-arm64.tar.gz"

          stage_platform_package \
            "${ROOT_DIR}/build/npm/agenthub-linux-arm64" \
            "${STAGE_ROOT}/agenthub-linux-arm64" \
            "agenthub-${PACKAGE_VERSION}-linux-arm64.tar.gz"

          stage_platform_package \
            "${ROOT_DIR}/build/npm/agenthub-linux-x64" \
            "${STAGE_ROOT}/agenthub-linux-x64" \
            "agenthub-${PACKAGE_VERSION}-linux-amd64.tar.gz"

          rm -rf "${STAGE_ROOT}/agenthub"
          mkdir -p "${STAGE_ROOT}/agenthub"
          cp -R "${ROOT_DIR}/build/npm/agenthub/." "${STAGE_ROOT}/agenthub/"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          stage_root = Path("dist/npm")

          for package_json in [
              stage_root / "agenthub" / "package.json",
              stage_root / "agenthub-darwin-arm64" / "package.json",
              stage_root / "agenthub-linux-arm64" / "package.json",
              stage_root / "agenthub-linux-x64" / "package.json",
          ]:
              data = json.loads(package_json.read_text())
              data["version"] = version
              if package_json.parent.name == "agenthub":
                  deps = data.get("optionalDependencies", {})
                  for key in list(deps.keys()):
                      deps[key] = version
              package_json.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Publish platform packages
        if: steps.npm_meta.outputs.publish_npm == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          npm publish dist/npm/agenthub-darwin-arm64 --access public
          npm publish dist/npm/agenthub-linux-arm64 --access public
          npm publish dist/npm/agenthub-linux-x64 --access public

      - name: Publish main package
        if: steps.npm_meta.outputs.publish_npm == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          npm publish dist/npm/agenthub --access public

  release:
    name: Create Release
    needs: [build, publish_npm]
    if: ${{ always() && !cancelled() && (needs.publish_npm.result == 'success' || needs.publish_npm.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Prepare release metadata
        id: release_meta
        shell: bash
        run: |
          TAG_VERSION="${{ github.event.inputs.version || github.ref_name }}"
          ASSET_VERSION="${TAG_VERSION#v}"
          PRERELEASE=false
          IS_SEMVER_TAG=false
          TAG_EXISTS=false
          if [[ "${TAG_VERSION}" == *alpha* || "${TAG_VERSION}" == *beta* || "${TAG_VERSION}" == *rc* ]]; then
            PRERELEASE=true
          fi
          if [[ "${TAG_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$ ]]; then
            IS_SEMVER_TAG=true
          fi
          if git ls-remote --tags origin "refs/tags/${TAG_VERSION}" | grep -q "refs/tags/${TAG_VERSION}$"; then
            TAG_EXISTS=true
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" \
             && "${IS_SEMVER_TAG}" == "true" \
             && "${TAG_EXISTS}" != "true" \
             && "${{ github.event.inputs.confirm_create_release_tag || 'false' }}" != "true" ]]; then
            echo "::error::Manual release would create a new semver tag (${TAG_VERSION}) from ${GITHUB_SHA}. Re-run with confirm_create_release_tag=true or use a preview tag."
            exit 1
          fi
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset_version=${ASSET_VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Display structure
        run: ls -R dist

      - name: Create source archive
        shell: bash
        run: |
          SOURCE_NAME="agenthub-${{ steps.release_meta.outputs.asset_version }}-source"
          git archive \
            --format=tar.gz \
            --prefix="${SOURCE_NAME}/" \
            --output="dist/${SOURCE_NAME}.tar.gz" \
            HEAD

      - name: Ensure release artifacts exist
        shell: bash
        run: |
          shopt -s nullglob
          release_archives=()
          for archive in dist/*.tar.gz; do
            if [[ "${archive}" != *-source.tar.gz ]]; then
              release_archives+=("${archive}")
            fi
          done
          if (( ${#release_archives[@]} == 0 )); then
            echo "::error::No binary release archives were produced by the build matrix."
            exit 1
          fi

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./*.tar.gz | sed 's# \./# #g' > SHA256SUMS.txt

      - name: Prepare release body
        id: release_body
        shell: bash
        run: |
          {
            echo "## Installation"
            echo
            if [[ "${{ needs.build.result }}" != "success" ]]; then
              echo "> [!WARNING]"
              echo "> One or more release targets failed in the build matrix."
              echo "> Successful artifacts are still attached below."
              echo
            fi
            echo "### Available assets"
            find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name 'SHA256SUMS.txt' \) -printf '%f\n' | sort | while read -r asset; do
              echo "- \`${asset}\`"
            done
            echo
            echo "Each binary archive contains one release binary plus the bundled \`README.md\`"
            echo "and \`LICENSE\` file when present."
            echo
            echo "### Verify checksums"
            echo "\`\`\`bash"
            echo "curl -L -O \"https://github.com/${{ github.repository }}/releases/download/${{ steps.release_meta.outputs.tag_version }}/SHA256SUMS.txt\""
            echo "# Download the archive(s) you want to verify into the same directory first."
            echo "sha256sum -c SHA256SUMS.txt"
            echo "\`\`\`"
            echo
            echo "## Documentation"
            echo
            echo "See [User Documentation](https://github.com/${{ github.repository }}/tree/main/userdocs) for detailed usage instructions."
          } > release-body.md

      - name: Display final release assets
        run: ls -R dist

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_version }}
          name: Release ${{ steps.release_meta.outputs.tag_version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          files: dist/**/*
          generate_release_notes: true
          body_path: release-body.md
