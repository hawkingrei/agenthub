name: User Docs

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  userdocs:
    name: User Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
        working-directory: userdocs
      - name: Build
        run: npm run build
        working-directory: userdocs
