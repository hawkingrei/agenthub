name: User Docs

on:
  push:
    branches: ["main"]
    paths:
      - "userdocs/**"
      - ".github/workflows/userdocs.yml"
      - "README.md"
      - "docs/features/2026-02-15-docusaurus-userdocs-site.md"
      - "docs/features/2026-02-15-userdocs-ci-build-check.md"
      - "docs/features/2026-02-15-userdocs-content-expansion.md"
      - "docs/todo.md"
  pull_request:
    paths:
      - "userdocs/**"
      - ".github/workflows/userdocs.yml"
      - "README.md"
      - "docs/features/2026-02-15-docusaurus-userdocs-site.md"
      - "docs/features/2026-02-15-userdocs-ci-build-check.md"
      - "docs/features/2026-02-15-userdocs-content-expansion.md"
      - "docs/todo.md"
  workflow_dispatch:

jobs:
  userdocs:
    name: User Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
        working-directory: userdocs
      - name: Build
        run: npm run build
        working-directory: userdocs
